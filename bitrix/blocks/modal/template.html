<div class="eg-scope">
<div class="eg-modal" id="eg-modal">
  <div class="eg-modal__overlay" data-eg-close-modal></div>
  <div class="eg-modal__card">
    <button class="eg-modal__close" data-eg-close-modal><svg class="eg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
    <h3>Заказать звонок</h3>
    <p>Оставьте номер, и наш специалист свяжется с вами в течение 15 минут</p>
    <form method="post" action="" data-eg-form="callback" class="eg-lead-form">
      <input type="text" name="name" placeholder="Ваше имя" required>
      <input type="tel" class="eg-phone-mask" name="phone" placeholder="+7 (___) ___-__-__" required>
      <button type="submit" class="eg-btn eg-btn--orange eg-btn--block">Жду звонка</button>
    </form>
  </div>
</div>
</div>
