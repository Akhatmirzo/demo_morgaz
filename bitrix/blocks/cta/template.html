<div class="eg-scope">
<section class="eg-cta" id="eg-contacts">
  <div class="eg-cta__bg">
    <img src="img/cta.webp" alt="Загородный дом вечером">
  </div>
  <div class="eg-container eg-cta__inner">
    <h2>Оставьте заявку — подготовим проект<br>и сориентируем по стоимости</h2>
    <p>Бесплатная консультация инженера и индивидуальный расчёт сметы</p>
    <form method="post" action="" data-eg-form="cta" class="eg-lead-form eg-lead-form--inline">
      <div class="eg-lead-form__row eg-lead-form__row--4">
        <input type="text" name="name" placeholder="Ваше имя" required>
        <input type="tel" class="eg-phone-mask" name="phone" placeholder="+7 (___) ___-__-__" required>
        <input type="email" name="email" placeholder="E-mail">
        <button type="submit" class="eg-btn eg-btn--orange">Оставить заявку</button>
      </div>
      <div class="eg-checkbox-row">
        <label class="eg-checkbox-line eg-checkbox-line--light"><input type="checkbox" name="agree_personal_data" value="Y" required><span>Согласен(а) на обработку персональных данных</span></label>
        <label class="eg-checkbox-line eg-checkbox-line--light"><input type="checkbox" name="agree_policy" value="Y" required><span>Ознакомлен(а) с политикой конфиденциальности</span></label>
      </div>
    </form>
  </div>
</section>
</div>
