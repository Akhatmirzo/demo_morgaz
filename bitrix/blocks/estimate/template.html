<div class="eg-scope">
<section class="eg-section eg-section--tint">
  <div class="eg-container eg-split">
    <div class="eg-split__text">
      <h2 class="eg-section__title">Получите смету и список документов</h2>
      <p>Подготовим индивидуальный расчёт и перечень документов для согласования в вашем случае</p>
      <form method="post" action="" data-eg-form="estimate" class="eg-lead-form eg-lead-form--inline">
        <div class="eg-lead-form__row">
          <input type="text" name="name" placeholder="Ваше имя" required>
          <input type="tel" class="eg-phone-mask" name="phone" placeholder="+7 (___) ___-__-__" required>
          <button type="submit" class="eg-btn eg-btn--orange">Получить материалы</button>
        </div>
        <div class="eg-checkbox-row">
          <label class="eg-checkbox-line"><input type="checkbox" name="agree_personal_data" value="Y" required><span>Согласен(а) на обработку персональных данных</span></label>
          <label class="eg-checkbox-line"><input type="checkbox" name="agree_policy" value="Y" required><span>Ознакомлен(а) с политикой конфиденциальности</span></label>
        </div>
      </form>
    </div>
    <div class="eg-split__media">
      <img src="img/estimate.webp" alt="Смета и чек-лист документов" loading="lazy">
    </div>
  </div>
</section>
</div>
